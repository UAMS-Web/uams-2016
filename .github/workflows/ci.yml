name: CI

# Adapted from .claude/skills/code-quality/templates/ci.yml in UAMS-Web/uams-claude-skills.
# This repository is public, so Actions minutes are free and no job is gated on RUN_REMOTE_CI.
#
# Dropped from the template, with no counterpart here: the mutation jobs (the theme has no
# mutation suite), and the Pest skip-baseline, slowest-class and global-symbol checks (the
# pest-testing skill is not synced into this repository).
#
# Added for this theme: `lint-floor` parses every shipped PHP file under PHP 8.2, the supported
# floor, and `build` installs the Node packages from package-lock.json and runs the Grunt
# build, so a broken build fails the workflow.
#
# The `CI` job at the end `needs:` every other job, runs `if: always()`, and fails unless every
# needed job reports `success`. A ruleset requires `CI` (with `Attribution footer` and
# `Closing keywords`, reported by the two pull-request-body workflows beside this file), so a job
# can be renamed or added by editing only the `needs:` list of `CI`. The aggregate-needs job
# fails the pull request when a job is left out. Do not rename `CI`.
#
# The shared setup (PHP, the Composer cache, the locked install) lives in
# `.github/actions/setup/action.yml`. Its PHP is 8.4, the development PHP pinned in
# `config.platform.php`; the supported floor (8.2) is checked by `lint-floor`.
#
# Pull requests to `dev`, `staging` and `master` are the branches this theme promotes through,
# so the workflow runs for a pull request to any of them. Every pull request is covered, and a
# push runs it on the three promotion branches.

on:
  pull_request:
  push:
    branches: [dev, staging, master]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run. Every other run gets a
# group of its own, keyed on the commit, so a later push never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  composer-validate:
    name: Composer validate (composer.lock freshness)
    # Legs: Linux only. It compares composer.json and composer.lock, which read the same on any platform.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # Fails when composer.json and composer.lock have drifted apart.
      - run: composer validate --no-check-publish --no-check-all

  synced-files:
    name: Synced files (no hand-edited rules or skills)
    # Legs: Linux only. It hashes tracked files against the sync manifest; the repository pins line endings, so the bytes match on every platform.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the file, when a synced rule or skill was edited by hand.
      - run: node .claude/skills/synced-files/scripts/check-synced-files.mjs

      # Fails when a workflow copied from a shared template differs from the template.
      - run: node .claude/skills/synced-files/scripts/check-workflow-copies.mjs

  no-emoji:
    name: No emoji in durable records
    # Legs: Linux only. It sweeps tracked prose for banned code points with Node alone; no platform branch in the script.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the file, line and code point, when prose carries a banned glyph.
      - run: node .claude/skills/writing-comments/scripts/check-no-emoji.mjs

  aggregate-needs:
    name: Aggregate needs
    # Legs: Linux only. It parses the workflow files and the allow-list with Node alone; no platform branch in the script.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the job, when a job is missing from the `needs:` list of `CI` or a
      # fixed required name is reported by no job. Allow-list: .github/aggregate-needs-allow.json.
      - run: node .claude/skills/code-quality/scripts/check-aggregate-needs.mjs

  lint-floor:
    name: Floor lint (PHP 8.2)
    # Legs: Linux only. It parses PHP source with the PHP it runs under; the result does not depend on the platform.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The supported floor, with no Composer install: the script is self-contained.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # Fails, naming the file and line, when a shipped PHP file uses syntax PHP 8.2 cannot parse.
      - run: php scripts/lint-floor.php

  build:
    name: Grunt build
    # Legs: Linux only. The build reads source files and writes compiled assets; a broken build fails the same way on any platform.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts: nothing the build needs runs on install.
      - run: npm ci --ignore-scripts

      # The build tests compare fresh builds with the committed compiled files, so they run
      # before `grunt` below, which rewrites those tracked files in the workspace.
      - run: npm test

      # The default task: jshint, concat, uglify, notify, less. A failing task fails the job.
      - run: npx grunt

  pint:
    name: Pint
    needs: [composer-validate, synced-files]
    # Legs: Linux only. Pint formats PHP source and reads the same rules on any platform.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:pint

  rector:
    name: Rector
    needs: [pint]
    # Legs: Linux only. Rector reads PHP source and its own config; the result does not depend on the platform.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:refactor

  phpstan:
    name: PHPStan
    needs: [pint]
    # Legs: Linux only. PHPStan analyses PHP source; the result does not depend on the platform.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # phpstan.neon.dist scans WordPress' test classes from the Integration suite's own
      # Composer install, and stops when the directory is missing.
      - run: composer setup:integration

      - run: composer stan

  pest:
    name: Pest (${{ matrix.os }})
    needs: [rector, phpstan]
    # Legs: all three. The suite is what runs on the platforms the code ships to: paths, command-line length, BSD tools, case-insensitive file systems.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The Unit suite only: the Integration suite needs WordPress and a test database, which
      # this workflow does not provide.
      - run: composer test:unit

  # The one check a ruleset requires from this workflow. Keep `needs:` listing every other job in the file.
  ci:
    name: CI
    needs: [composer-validate, synced-files, no-emoji, aggregate-needs, lint-floor, build, pint, rector, phpstan, pest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list (an emptied `needs:`, a dropped `env:`) would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
