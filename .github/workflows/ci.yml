name: CI

# Calls the shared reusable workflow (`.claude/skills/code-quality/templates/ci-reusable.yml` in
# UAMS-Web/uams-claude-skills, published as UAMS-Web/uams-ci-workflows) for the repository-wide
# checks: composer validate, synced files and workflow copies, no-emoji, aggregate-needs, Pint,
# Rector, PHPStan, the `@pest-mutate-ignore` annotation check, and mutation testing. This
# repository is public, so Actions minutes are free and no job is gated on RUN_REMOTE_CI.
#
# Kept as jobs of its own, beside the call:
# - `lint-floor` parses every shipped PHP file under PHP 8.2, the supported floor.
# - `build` installs the Node packages from package-lock.json and runs the Grunt build.
# - `pest` runs the Unit suite on three operating systems. The shared `pest` job runs `composer
#   test`, which includes the Integration suite, and that needs WordPress and a test database
#   this workflow does not provide, so the call passes `pest: false`.
#
# Inputs to the call:
# - `linux-only: true`: every shared job runs on ubuntu-latest. The annotation check reports a
#   trailing `@pest-mutate-ignore` marker where PHP_EOL is CRLF and the files are LF (a Windows
#   runner under `eol=lf`), and mutation scores are taken on Linux only
#   (UAMS-Web/uams-ci-workflows#13). The suite itself still runs on all three systems in `pest`.
# - `mutate-paths` names the files the #102 coverage slices have brought to the Full coverage
#   bar. Extend it, and the `mutate` script in composer.json, as each slice lands. A pull request
#   mutates only the changed files among them; a manual run (Actions > CI > Run workflow)
#   mutates all of them (`composer mutate`).
# - `mutate-ignore-paths` names the directories the annotation check scans. The script reads
#   directories only, so a marker in a root-level file (`functions.php`, `header.php`) is not
#   checked, and `.` would walk into `vendor/`.
#
# The shared workflow is pinned to a commit (tag v0.9.0), so it takes a change when this file does.
#
# The `CI` job at the end `needs:` every other job, runs `if: always()`, and fails unless every
# needed job reports `success`. A ruleset requires `CI` (with `Attribution footer` and
# `Closing keywords`, reported by the two pull-request-body workflows beside this file), so a job
# can be renamed or added by editing only the `needs:` list of `CI`. The aggregate-needs job
# fails the pull request when a job is left out. Do not rename `CI`.
#
# The shared setup (PHP, the Composer cache, the locked install) lives in
# `.github/actions/setup/action.yml`. Its PHP is 8.4, the development PHP pinned in
# `config.platform.php`; the supported floor (8.2) is checked by `lint-floor`.
#
# This theme uses a single-branch flow: an issue branch opens one pull request to `master`.
# The workflow runs for every pull request, and for a push to `master`.

on:
  pull_request:
  push:
    branches: [master]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run. Every other run gets a
# group of its own, keyed on the commit, so a later push never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    # Reported as `checks / <job> (ubuntu-latest)`. Pinned to the commit of tag v0.9.0.
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@5523d479fa9cdc1c3bfdd581f3f07f730da93451
    with:
      linux-only: true
      pest: false
      mutate-paths: '*.php templates inc scripts setup/class.uams-acf.php setup/class.uams-basic-custom-post.php setup/class.uams-carousel.php setup/class.uams-documentation-dashboard-widget.php setup/class.uams-homeslider-meta-box.php setup/class.uams-iframes.php setup/class.uams-media-caption.php setup/class.uams-media-credit.php setup/class.uams-oembeds.php setup/class.uams-page-attributes-meta-box.php setup/class.uams-quicklinks.php setup/class.uams-replace-media.php setup/class.uams-scripts.php setup/class.uams-settings.php setup/class.uams-sidebar-menu-walker.php setup/class.uams-plugins.php setup/class.uams-styles.php setup/class.users.php setup/class.dropdowns_walker.php setup/class.filters.php setup/class.googleapps.php setup/class.images.php setup/class.install.php setup/class.mimes.php setup/class.squish_bugs.php setup/class.uams-tinymce.php setup/custom-post-types.php setup/class.uams.php setup/class.uams-dropdowns.php setup/class.uams-enclosure.php setup/class.uams-shortcodes.php setup/class.*-shortcode.php'
      mutate-ignore-paths: 'inc scripts setup templates tests'

  lint-floor:
    name: Floor lint (PHP 8.2)
    # Legs: Linux only. It parses PHP source with the PHP it runs under; the result does not depend on the platform.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The supported floor, with no Composer install: the script is self-contained.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # Fails, naming the file and line, when a shipped PHP file uses syntax PHP 8.2 cannot parse.
      - run: php scripts/lint-floor.php

  build:
    name: Grunt build
    # Legs: Linux only. The build reads source files and writes compiled assets; a broken build fails the same way on any platform.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts: nothing the build needs runs on install.
      - run: npm ci --ignore-scripts

      # The build tests compare fresh builds with the committed compiled files, so they run
      # before `grunt` below, which rewrites those tracked files in the workspace.
      - run: npm test

      # The default task: jshint, concat, uglify, notify, less. A failing task fails the job.
      - run: npx grunt

  pest:
    name: Pest (${{ matrix.os }})
    # Legs: all three. The suite is what runs on the platforms the code ships to: paths, command-line length, BSD tools, case-insensitive file systems.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The Unit suite only: the Integration suite needs WordPress and a test database, which
      # this workflow does not provide.
      - run: composer test:unit

  # The one check a ruleset requires from this workflow. Keep `needs:` listing every other job in the file.
  ci:
    name: CI
    needs: [checks, lint-floor, build, pest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list (an emptied `needs:`, a dropped `env:`) would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
